# Configuration Quarkus pour développement

# Application
quarkus.application.name=parser-service
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Server
quarkus.http.port=8000
quarkus.http.cors=true

# Request limits
quarkus.http.limits.max-body-size=10M

# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.nayyelin.idocparser".level=DEBUG

# Health checks
quarkus.smallrye-health.root-path=/health

# Dev mode
%dev.quarkus.log.category."com.nayyelin.idocparser".level=DEBUG
%dev.quarkus.http.port=8000

# TODO: Ajouter vos configurations spécifiques

quarkus.http.cors.access-control-allow-credentials=true

quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*